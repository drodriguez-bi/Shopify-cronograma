name: Scheduler cron (cada 5 min)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  run-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de cron del scheduler
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.SCHEDULER_CRON_SECRET }}" \
            "${{ vars.SCHEDULER_URL }}/api/scheduler/cron"
